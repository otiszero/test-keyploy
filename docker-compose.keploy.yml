services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: chatuser
      POSTGRES_PASSWORD: chatpass
      POSTGRES_DB: realtime_chat
    ports:
      - "5455:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - keploy-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatuser -d realtime_chat"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgresql://chatuser:chatpass@postgres:5432/realtime_chat?schema=public
      JWT_SECRET: your-super-secret-jwt-key-change-in-production
      JWT_EXPIRATION: 24h
      PORT: 5000
      NODE_ENV: development
      BCRYPT_SALT_ROUNDS: 10
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - keploy-network

networks:
  keploy-network:
    external: true

volumes:
  postgres_data:
